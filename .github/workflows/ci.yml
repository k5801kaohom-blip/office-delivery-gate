name: CI

# Proves every push and pull request leaves the repository in a state a fresh clone can
# install and use, and that the checks doing the proving can actually fail.
#
# The failure this exists to catch: SKILL.md documenting a file that was never committed.
# The skill looks complete, the contract check passes on the author's machine because the
# file is still there, and everyone who clones gets a skill that documents a pipeline it
# does not contain. Only a clean clone detects it.
#
# The second failure it exists to catch is quieter: a contract checker that always passes.
# A green stage proves nothing unless the checker has been shown to reject a broken skill,
# so negative-control runs the checker against deliberately broken copies.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly, to catch drift no push caused: a file deleted on the remote, or a tool the
    # checks depend on disappearing.
    - cron: "0 1 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ---------------------------------------------------------------- self-verification
  verify:
    name: repository integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history and a real remote, so the commit-sync stage is meaningful.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Show environment
        run: |
          echo "commit : $GITHUB_SHA"
          echo "ref    : $GITHUB_REF"
          echo "event  : $GITHUB_EVENT_NAME"
          python3 --version
          git --version

      # On a pull_request event the checked-out HEAD is a merge commit, not origin/main,
      # so the sync stages would report a false failure on every PR. Sync runs on push;
      # pull requests run the integrity stages offline.
      - name: Repository integrity
        run: |
          set -o pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            ./verify_skill_repo.sh --json verify-report.json
          else
            ./verify_skill_repo.sh --offline --json verify-report.json
          fi

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-report
          path: verify-report.json
          if-no-files-found: warn
          retention-days: 30

  # ----------------------------------------------------------------- contract checking
  contract:
    name: skill contract
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Locate the payload rather than assuming its name, so this workflow keeps working
      # when the skill is renamed.
      - name: Locate the skill payload
        id: payload
        run: |
          set -euo pipefail
          SKILL_MD="$(find . -maxdepth 2 -name SKILL.md -not -path './.git/*' | head -1)"
          test -n "$SKILL_MD" || { echo "no SKILL.md found"; exit 1; }
          SKILL_DIR="$(dirname "$SKILL_MD")"
          echo "skill_dir=$SKILL_DIR" >> "$GITHUB_OUTPUT"
          echo "skill_name=$(basename "$SKILL_DIR")" >> "$GITHUB_OUTPUT"
          echo "payload: $SKILL_DIR"

      - name: Contract check
        run: |
          set -euo pipefail
          python3 scripts/check_skill_contract.py \
            --skill "${{ steps.payload.outputs.skill_dir }}" \
            --json contract-report.json

      # A checker that always passes manufactures confidence. Prove it rejects each fault
      # it claims to detect before trusting a green contract stage.
      - name: Negative control — prove the checker can fail
        run: |
          set -euo pipefail
          # Prefer the payload's own copy, fall back to repository tooling. Auto-detected
          # so this workflow survives a skill rename.
          NEGCTL=""
          for cand in "${{ steps.payload.outputs.skill_dir }}/scripts/ci_negative_control.py" \
                      scripts/ci_negative_control.py; do
            [ -f "$cand" ] && NEGCTL="$cand" && break
          done
          test -n "$NEGCTL" || { echo "ci_negative_control.py not found"; exit 1; }
          echo "using: $NEGCTL"
          python3 "$NEGCTL" \
            --skill "${{ steps.payload.outputs.skill_dir }}" \
            --checker scripts/check_skill_contract.py \
            --json negative-control-report.json

      - name: Upload contract reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-reports
          path: |
            contract-report.json
            negative-control-report.json
          if-no-files-found: ignore
          retention-days: 30

  # -------------------------------------------------------------- payload self-testing
  payload:
    name: skill payload check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # A skill that needs third-party packages declares them in requirements.txt, so CI
      # can install them before checking that the scripts import. Without this, a missing
      # dependency would surface as a broken script rather than an incomplete environment.
      - name: Install declared dependencies
        run: |
          set -euo pipefail
          if [ -f requirements.txt ]; then
            python3 -m pip install --quiet --requirement requirements.txt
            echo "installed from requirements.txt"
          else
            echo "no requirements.txt; relying on the standard library"
          fi

      # Runs exactly what a consumer runs immediately after installing, so a regression in
      # the skill's own tooling fails on its own signal instead of hiding behind the
      # aggregate verification job.
      - name: Install into a scratch skills directory
        run: |
          set -euo pipefail
          export SKILLS_DIR="$RUNNER_TEMP/skills"
          ./install.sh
          test -f "$SKILLS_DIR"/*/SKILL.md || {
            echo "install.sh produced no SKILL.md"; exit 1; }
          echo "SKILLS_DIR=$SKILLS_DIR" >> "$GITHUB_ENV"

      - name: Contract check on the installed copy
        run: |
          set -euo pipefail
          SKILL_DIR="$(find "$SKILLS_DIR" -mindepth 1 -maxdepth 1 -type d | head -1)"
          echo "installed: $SKILL_DIR"
          if [ -f "$SKILL_DIR/scripts/check_skill_contract.py" ]; then
            python3 "$SKILL_DIR/scripts/check_skill_contract.py" \
              --skill "$SKILL_DIR" --json installed-contract-report.json
          else
            echo "no contract checker inside the payload; structure check only"
          fi

      - name: Every shipped script imports
        run: |
          set -euo pipefail
          SKILL_DIR="$(find "$SKILLS_DIR" -mindepth 1 -maxdepth 1 -type d | head -1)"
          # A real file, not an inline heredoc: a heredoc inside `run: |` ends the block
          # scalar early and produces a YAML error far from its cause, and it cannot be
          # tested locally. See references/ci-cd-design.md.
          python3 scripts/ci_import_check.py \
            --skill-dir "$SKILL_DIR" \
            --json import-report.json

      - name: Upload import report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: import-report
          path: import-report.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Packaging produces a valid archive
        if: hashFiles('package.sh') != ''
        run: |
          set -euo pipefail
          ./package.sh
          ARCHIVE="$(ls dist/*.zip | head -1)"
          echo "archive: $ARCHIVE"
          # A zip that lost the payload still looks like a successful build.
          unzip -l "$ARCHIVE" | grep -q "SKILL.md" || {
            echo "archive is missing SKILL.md"; exit 1; }
          # Prove the archive is installable, not merely non-empty.
          rm -rf "$RUNNER_TEMP/unpacked" && mkdir -p "$RUNNER_TEMP/unpacked"
          unzip -q "$ARCHIVE" -d "$RUNNER_TEMP/unpacked"
          test -f "$RUNNER_TEMP/unpacked"/*/SKILL.md || {
            echo "unpacked archive has no SKILL.md"; exit 1; }
          echo "archive unpacks to a usable skill"

      - name: Upload package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skill-package
          path: dist/*.zip
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload installed contract report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-contract-report
          path: installed-contract-report.json
          if-no-files-found: ignore
          retention-days: 30

  # ------------------------------------------------------------------------ summary
  summary:
    name: summary
    runs-on: ubuntu-latest
    needs: [verify, contract, payload]
    # Run even when a dependency failed, so the summary explains the failure rather than
    # being skipped precisely when it is most needed.
    if: always()
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download reports
        if: always()
        uses: actions/download-artifact@v4
        with:
          path: reports

      - name: Job summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## CI — ${{ github.repository }}"
            echo
            echo "Commit \`${GITHUB_SHA:0:7}\` on \`${{ github.ref_name }}\` (\`${{ github.event_name }}\`)"
            echo
            find reports -name '*.json' 2>/dev/null | sort | while read -r f; do
              echo "<!-- $f -->"
            done
            python3 scripts/ci_summary.py $(find reports -name '*.json' 2>/dev/null | sort) || true
            echo
            echo "---"
            echo
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| repository integrity | ${{ needs.verify.result }} |"
            echo "| skill contract | ${{ needs.contract.result }} |"
            echo "| skill payload check | ${{ needs.payload.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verdict
        run: |
          set -euo pipefail
          FAILED=0
          for r in "${{ needs.verify.result }}" "${{ needs.contract.result }}" "${{ needs.payload.result }}"; do
            [ "$r" = "success" ] || FAILED=1
          done
          if [ "$FAILED" -eq 1 ]; then
            echo "::error::one or more CI jobs did not succeed"
            exit 1
          fi
          echo "all CI jobs succeeded"
